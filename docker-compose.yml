services:
  stats-db:
    image: postgres:16.1
    container_name: ewm-stats-db
    ports:
      - "6541:5432"
    environment:
      POSTGRES_DB: explorewithme
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d explorewithme -U dbuser"]
      interval: 5s
      timeout: 5s
      retries: 10

  stats-server:
    build:
      context: ./stats-service/stats-server
      dockerfile: Dockerfile
    container_name: ewm-stats-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/explorewithme
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: 12345

  main-db:
    image: postgres:16.1
    container_name: ewm-main-db
    ports:
      - "6542:5432"
    environment:
      POSTGRES_DB: ewm_main
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ewm_main -U dbuser"]
      interval: 5s
      timeout: 5s
      retries: 10

  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile
    container_name: ewm-main-service
    ports:
      - "8080:8080"
    depends_on:
      main-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://main-db:5432/ewm_main
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: 12345
      STATS_SERVER_URL: http://stats-server:9090

volumes:
  stats-db-data:
  main-db-data: